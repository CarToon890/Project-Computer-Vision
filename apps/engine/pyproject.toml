[project]
name = "omr-cnn-engine"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.14.1+cpu",
  "numpy==2.5.4",
  "opencv-python-headless==5.0.0.93",
  "Pillow==12.3.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pillow-heif==1.8.1",
  "psycopg[binary]==3.3.6",
  "vercel-blob==0.5.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.vercel]
entrypoint = "app:app"
